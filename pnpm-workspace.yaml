  "@ai-sdk/openai": 4.0.117
  "@biomejs/biome": 2.6.8
  "@opentelemetry/api": ^1.10.0
  "@opentelemetry/api-logs": ^0.223.0
  "@vercel/oidc": 4.0.9
  "@vercel/otel": ^2.3.0

  eve: 1.0.0
  lucide-react: 1.67.0
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": ^19
  "@types/react-dom": ^19
  "@types/node": ^26
  "@tailwindcss/postcss": ^4
  tailwindcss: ^4
  typescript: ^5
  tslog: 5.5.0

allowBuilds:
