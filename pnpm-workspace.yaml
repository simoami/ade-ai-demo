  "@vercel/oidc": 4.0.9
  "@biomejs/biome": 2.6.8
  eve: 1.0.0
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": ^19
  "@types/react-dom": ^19
  "@types/node": ^26
  "@tailwindcss/postcss": ^4
