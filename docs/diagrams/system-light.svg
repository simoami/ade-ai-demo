<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" width="1920" height="1120" role="img" aria-labelledby="title desc">
<title id="title">System diagram: ingestion of clinical documents on Vercel</title>
<desc id="desc">A reviewer browser reaches one Vercel project through Deployment Protection (Vercel Authentication or a shareable link). In region iad1 the Next.js 16 web service serves a Partial Prerendering shell, Suspense streaming, tagged use cache entries and route handlers for /api/documents and /api/uploads. It calls the eve service over a private binding with OIDC. eve runs one durable Vercel Workflow per document: Render, Read, then Classify, Demographics and Detect identifiers in parallel, Redact, Extract observations and a review loop. eve writes to private Vercel Blob and Neon Postgres with pgvector, and calls Reducto r-1 and OpenAI through the AI SDK. The browser uploads to Blob with a client upload token and loads page images through signed URLs valid for 15 minutes. Web reads Neon. The Vercel Build System deploys both services from vercel.ts.</desc>
