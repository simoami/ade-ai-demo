<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Note chunking: each note section becomes one chunk with its section path stored apart from the body; an oversized section splits at the last full sentence before the limit, and the next chunk repeats that sentence">
<style>
.bg{fill:#0a0a0a}
.frame{fill:#0a0a0a;stroke:#2e2e2e;stroke-width:1.5}
.panel{fill:url(#hatch);stroke:#2e2e2e;stroke-width:1.5}
.box{fill:#111111;stroke:#262626;stroke-width:1.5}
.rule{stroke:#2e2e2e;stroke-width:1.5}
.guide{stroke:#404040;stroke-width:1.2;stroke-dasharray:4 4}
.label{font:600 15px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#ededed;letter-spacing:1px}
.tag{font:400 11px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#888888;letter-spacing:.6px}
.key{font:400 12px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#888888;letter-spacing:.6px}
.sub{font:400 14px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#888888}
.h1{font:600 20px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ededed}
.h2{font:600 16px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ededed}
.body{font:400 15px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#bdbdbd}
.val{font:500 15px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ededed}
.code{font:400 14px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#bdbdbd}
.acc{fill:#10b981}
.accbox{fill:#052e26;stroke:#10b981;stroke-width:1.5}
.acctint{fill:#064e3b;stroke:none}
.acctext{font:600 11px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#10b981;letter-spacing:.8px}
.edge{fill:none;stroke:#ededed;stroke-width:1.5}
.head{fill:#ededed}
.accedge{fill:none;stroke:#10b981;stroke-width:1.5}
.acchead{fill:#10b981}
.warnline{stroke:#f43f5e;stroke-width:2;stroke-dasharray:5 4}
.warntext{font:600 11px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#f43f5e;letter-spacing:.8px}
.pill{fill:#111111;stroke:#262626;stroke-width:1.2}
</style>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0d0d0d"/><line x1="0" y1="0" x2="0" y2="8" stroke="#171717" stroke-width="1"/></pattern>
</defs>
<rect class="bg" width="1200" height="900"/>
<rect class="frame" x="16" y="16" width="1168" height="868" rx="6"/>
<text class="label" x="48" y="62">1 · EACH NOTE SECTION BECOMES A CHUNK</text>
<rect class="panel" x="48" y="86" width="380" height="304" rx="6"/>
<rect class="box" x="64" y="102" width="348" height="272" rx="4"/>
<text class="h1" x="84" y="142">Screening visit</text>
<rect class="pill" x="256" y="126" width="140" height="20" rx="4"/><text class="tag" x="326.0" y="140" text-anchor="middle">TITLE · LEVEL 1</text>
<text class="h2" x="84" y="194">Chief complaint</text>
<rect class="pill" x="256" y="178" width="140" height="20" rx="4"/><text class="tag" x="326.0" y="192" text-anchor="middle">SECTION · LEVEL 2</text>
<text class="body" x="84" y="222">Fatigue for two weeks.</text>
<text class="h2" x="84" y="274">Plan</text>
<rect class="pill" x="256" y="258" width="140" height="20" rx="4"/><text class="tag" x="326.0" y="272" text-anchor="middle">SECTION · LEVEL 2</text>
<text class="body" x="84" y="302">Start iron. Recheck CBC in 4 weeks.</text>
<text class="tag" x="84" y="354">PAGE 1</text>
<path class="edge" d="M428 208 H492"/><path class="head" d="M500 208 l-9 -5 v10 z"/>
<path class="edge" d="M428 288 H492"/><path class="head" d="M500 288 l-9 -5 v10 z"/>
<rect class="box" x="500" y="146" width="652" height="124" rx="6"/>
<text class="key" x="520" y="178">SECTION</text><text class="val" x="612" y="178">Screening visit › Chief complaint</text>
<text class="key" x="520" y="210">TEXT</text><text class="val" x="612" y="210">Fatigue for two weeks.</text>
<text class="key" x="520" y="244">EMBEDS</text><text class="code" x="612" y="244"><tspan class="acc">[Screening visit › Chief complaint]</tspan> Fatigue for two weeks.</text>
<rect class="pill" x="1080" y="164" width="56" height="20" rx="4"/><text class="tag" x="1108" y="178" text-anchor="middle">PAGE 1</text>
<rect class="box" x="500" y="282" width="652" height="124" rx="6"/>
<text class="key" x="520" y="314">SECTION</text><text class="val" x="612" y="314">Screening visit › Plan</text>
<text class="key" x="520" y="346">TEXT</text><text class="val" x="612" y="346">Start iron. Recheck CBC in 4 weeks.</text>
<text class="key" x="520" y="380">EMBEDS</text><text class="code" x="612" y="380"><tspan class="acc">[Screening visit › Plan]</tspan> Start iron. Recheck CBC in 4 weeks.</text>
<rect class="pill" x="1080" y="300" width="56" height="20" rx="4"/><text class="tag" x="1108" y="314" text-anchor="middle">PAGE 1</text>
<text class="sub" x="48" y="430">The heading path is stored once in the section field. Only the embedding input adds it, in brackets, so a search for “chief complaint” finds the body.</text>
<line class="rule" x1="48" y1="460" x2="1152" y2="460"/>
<text class="label" x="48" y="506">2 · AN OVERSIZED SECTION SPLITS AT A SENTENCE</text>
<text class="sub" x="48" y="534">Section “Screening visit › Assessment” is longer than the 2,000-character limit.</text>
<rect class="box" x="48" y="596" width="200" height="52" rx="4"/>
<text class="body" x="64" y="627">History reviewed today.</text>
<rect class="box" x="256" y="596" width="190" height="52" rx="4"/>
<text class="body" x="272" y="627">Labs remain stable.</text>
<rect class="accbox" x="454" y="596" width="280" height="52" rx="4"/>
<text class="body" x="470" y="627">Continue iron 65 mg b.i.d.</text>
<rect class="box" x="742" y="596" width="300" height="52" rx="4"/>
<rect class="box" x="1050" y="596" width="102" height="52" rx="4"/>
<text class="body" x="1066" y="627">Recheck.</text>
<text class="body" x="890" y="627" text-anchor="end">Discussed metfor</text><text class="body" x="894" y="627">min side effects.</text>
<line class="warnline" x1="892" y1="576" x2="892" y2="668"/>
<text class="warntext" x="892" y="568" text-anchor="middle">2,000 CHARACTERS · A FIXED CUT WOULD SPLIT “METFORMIN”</text>
<line class="guide" x1="454" y1="648" x2="454" y2="804"/>
<line class="guide" x1="734" y1="648" x2="734" y2="804"/>
<rect class="box" x="48" y="704" width="686" height="44" rx="4"/>
<rect class="acctint" x="455" y="705" width="278" height="42" rx="3"/>
<text class="label" x="64" y="732">CHUNK 1</text><text class="tag" x="164" y="731">SENTENCES 1–3 · ENDS ON A FULL SENTENCE</text>
<text class="acctext" x="594" y="731" text-anchor="middle">LAST SENTENCE</text>
<rect class="box" x="454" y="760" width="698" height="44" rx="4"/>
<rect class="acctint" x="455" y="761" width="278" height="42" rx="3"/>
<text class="acctext" x="594" y="787" text-anchor="middle">OVERLAP · REPEATED</text>
<text class="label" x="758" y="788">CHUNK 2</text><text class="tag" x="858" y="787">SENTENCES 3–5</text>
<path class="accedge" d="M892 668 V680 H744 Q736 680 736 688 V696"/><path class="acchead" d="M736 704 l-5 -9 h10 z"/>
<text class="acctext" x="902" y="676">MOVES BACK TO THE SENTENCE BOUNDARY</text>
<text class="sub" x="48" y="848">No word, dose or qualifier is cut. The next chunk opens with the previous chunk’s last sentence, so a thought split at the boundary reads on both sides.</text>
</svg>
