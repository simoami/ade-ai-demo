<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 316" width="1232" height="316" role="img" aria-label="An oversized note section splits at the last full sentence before the 2,000-character limit instead of mid-word, and the next chunk repeats that sentence as overlap">
<style>
.bg{fill:#0a0a0a}
.frame{fill:#0a0a0a;stroke:#2e2e2e;stroke-width:1.5}
.box{fill:#111111;stroke:#262626;stroke-width:1.5}
.guide{stroke:#404040;stroke-width:1.2;stroke-dasharray:4 4}
.label{font:600 14px 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;fill:#ededed;letter-spacing:1px}
.note{font:400 13px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#888888}
.body{font:400 15px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#bdbdbd}
.accbox{fill:#052e26;stroke:#10b981;stroke-width:1.5}
.acctint{fill:#064e3b;stroke:none}
.accnote{font:500 13px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#10b981}
.accedge{fill:none;stroke:#10b981;stroke-width:1.5}
.acchead{fill:#10b981}
.warnline{stroke:#f43f5e;stroke-width:2;stroke-dasharray:5 4}
.warnnote{font:500 13px Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#f43f5e}
</style>
<rect class="bg" width="1232" height="316"/>
<rect class="frame" x="16" y="16" width="1200" height="284" rx="6"/>
<rect class="box" x="48" y="74" width="200" height="52" rx="4"/>
<text class="body" x="64" y="105">History reviewed today.</text>
<rect class="box" x="256" y="74" width="190" height="52" rx="4"/>
<text class="body" x="272" y="105">Labs remain stable.</text>
<rect class="accbox" x="454" y="74" width="280" height="52" rx="4"/>
<text class="body" x="470" y="105">Continue iron 65 mg b.i.d.</text>
<rect class="box" x="742" y="74" width="300" height="52" rx="4"/>
<rect class="box" x="1050" y="74" width="102" height="52" rx="4"/>
<text class="body" x="1066" y="105">Recheck.</text>
<text class="body" x="890" y="105" text-anchor="end">Discussed metfor</text><text class="body" x="894" y="105">min side effects.</text>
<line class="warnline" x1="892" y1="54" x2="892" y2="146"/>
<text class="warnnote" x="892" y="46" text-anchor="middle">2,000 characters: a fixed cut would split “metformin”</text>
<line class="guide" x1="454" y1="126" x2="454" y2="282"/>
<line class="guide" x1="734" y1="126" x2="734" y2="282"/>
<rect class="box" x="48" y="182" width="686" height="44" rx="4"/>
<rect class="acctint" x="455" y="183" width="278" height="42" rx="3"/>
<text class="label" x="64" y="210">CHUNK 1</text><text class="note" x="160" y="209">Sentences 1–3, ending on a full sentence</text>
<text class="accnote" x="594" y="209" text-anchor="middle">Last sentence</text>
<rect class="box" x="454" y="238" width="698" height="44" rx="4"/>
<rect class="acctint" x="455" y="239" width="278" height="42" rx="3"/>
<text class="accnote" x="594" y="265" text-anchor="middle">Overlap: repeated sentence</text>
<text class="label" x="758" y="266">CHUNK 2</text><text class="note" x="852" y="265">Sentences 3–5</text>
<path class="accedge" d="M892 146 V158 H744 Q736 158 736 166 V174"/><path class="acchead" d="M736 182 l-5 -9 h10 z"/>
<text class="accnote" x="902" y="155">Instead, moves back to the sentence boundary</text>
</svg>
